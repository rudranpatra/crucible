[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible-gym"
version = "0.5.4"
description = "Adversarial Intelligence Engine for CI/CD Pipelines"
readme = "crucible/README.md"
license = "Apache-2.0"
authors = [
  {name = "Rudra Patra", email = "rudran.patra@gmail.com"},
]
keywords = ["ci-cd", "adversarial", "testing", "devops", "chaos-engineering", "resilience"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",

  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Systems Administration",
]
requires-python = ">=3.9"
dependencies = [
  "pyyaml>=6.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.100.0", "uvicorn>=0.22.0"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "black>=23.0.0", "mypy>=1.0.0", "ruff>=0.1.0", "pip-audit>=2.6.0"]

[project.urls]
Homepage = "https://github.com/rudranpatra/crucible"
Repository = "https://github.com/rudranpatra/crucible"
Issues = "https://github.com/rudranpatra/crucible/issues"
Documentation = "https://github.com/rudranpatra/crucible#readme"

[project.scripts]
crucible = "crucible.cli.crucible:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crucible*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["crucible/tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Enforce runtime correctness in the GA gate; legacy style cleanup is tracked
# separately and must not hide undefined names or syntax errors.
select = ["E9", "F"]

[tool.mypy]
# 3.9 is EOL and the installed mypy (2.x) refuses to type-check against it
# ("Python 3.9 is not supported (must be 3.10 or higher)"), crashing every
# CI run. 3.10 is the lowest version both mypy still supports and this
# project still declares support for (requires-python >=3.9, matrix
# 3.9-3.12 above) — this only changes what mypy targets, not what versions
# crucible-gym runs on.
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
